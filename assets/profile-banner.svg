<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Amit Verma — Backend engineer and AI builder</title>
  <desc id="desc">A dark engineering canvas with a connected diagram of agents, APIs, data, and cloud.</desc>
